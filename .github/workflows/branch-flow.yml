name: Branch flow

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

jobs:
  require-dev-source:
    name: Require dev as merge source
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the PR comes from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev (this PR is from '$HEAD_REF'). Merge your branch into dev first, then promote dev to main."
            exit 1
          fi
          echo "OK: source branch is dev."
